  key_files:
    - path: "src/data/interfaces.py"
      reason: "Define interfaces for data handling"
    - path: "src/preprocess/interfaces.py"
      reason: "Define interfaces for preprocessing"
    - path: "src/models/interfaces.py"
      reason: "Define interfaces for models and training"
    - path: "src/main.py"
      reason: "Create application entry point with dependency injection"
  steps:
    - "Create interfaces for all components"
    - "Refactor data handling classes to follow SRP and ISP"
    - "Refactor preprocessing classes to follow SRP and OCP"
    - "Refactor model classes to follow LSP and DIP"
    - "Refactor utility classes to follow SRP"
    - "Create main application class with DIP"
    - "Add example scripts and tests"
